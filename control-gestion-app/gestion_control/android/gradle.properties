# La PC de desarrollo tiene poca RAM libre (unos 2 GB): la plantilla le daba a Gradle hasta 8 GB y dejaba el proceso
# vivo después de compilar. Con 2 GB alcanza para esta app, Kotlin compila dentro del mismo proceso (sin otro daemon) y
# Gradle se cierra al terminar: cada compilación tarda un poco más en arrancar, pero devuelve la memoria.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
org.gradle.daemon=false
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
