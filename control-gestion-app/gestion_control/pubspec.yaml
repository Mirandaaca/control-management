name: gestion_control
description: "App de los promotores de Del Campo SRL: ventas, cobranzas, pedidos y rutas en campo."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^17.5.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Inter, con los pesos estáticos del tema (400, 500 y 600): Flutter no aplica FontWeight al eje de una fuente
  # variable. Licencia OFL en assets/fuentes/inter/OFL.txt.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fuentes/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fuentes/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fuentes/inter/Inter-SemiBold.ttf
          weight: 600
